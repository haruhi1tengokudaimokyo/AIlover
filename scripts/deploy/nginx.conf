# Replace companion.example.com and both filesystem paths before installation.
# Terminate TLS with your certificate configuration. Only trust proxy headers from nginx.
server {
    listen 443 ssl;
    server_name companion.example.com;
    ssl_certificate /etc/letsencrypt/live/companion.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/companion.example.com/privkey.pem;
    client_max_body_size 10m;
    location /static/ { alias /srv/ailover/data/static-collected/; }
    # Only display assets are public. Do not expose the entire media directory (voice references, etc.).
    location ~ ^/media/(character/(photos|background_images|portraits|stage)|user/photos)/ {
        root /srv/ailover/data;
        add_header X-Content-Type-Options nosniff;
    }
    location /media/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
